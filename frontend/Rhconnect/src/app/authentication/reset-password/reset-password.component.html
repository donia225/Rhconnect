<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-lock auth-icon"></i>
        </div>
        <h3 class="mb-4">
          {{ uid ? 'Réinitialiser votre mot de passe' : 'Mot de passe oublié' }}
        </h3>

        <!-- Si l'utilisateur n'a pas encore cliqué sur le lien dans l'email -->
        <form *ngIf="!uid" (ngSubmit)="submit()" #emailForm="ngForm">
          <div class="form-group mb-3">
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              class="form-control"
              placeholder="Adresse email"
              required
              email
              #emailCtrl="ngModel"
            />
          </div>
          <small *ngIf="emailCtrl.invalid && emailCtrl.touched" class="text-danger">
            Veuillez entrer un email valide.
          </small>
          <button class="btn btn-primary mb-4" type="submit">Envoyer</button>
        </form>

        <!-- Si l'utilisateur a cliqué sur le lien de réinitialisation -->
        <form *ngIf="uid" (ngSubmit)="submit()" #passwordForm="ngForm">
          <div class="form-group mb-3">
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              class="form-control"
              placeholder="Nouveau mot de passe"
              required
              pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
              #pwdCtrl="ngModel"
            />
            <small *ngIf="pwdCtrl.invalid && pwdCtrl.touched" class="text-danger">
              Le mot de passe doit contenir au moins 8 caractères, incluant une lettre, un chiffre et un caractère spécial.
            </small>
          </div>

          <div class="form-group mb-3">
            <input
              type="password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              class="form-control"
              placeholder="Confirmation"
              required
              #confirmCtrl="ngModel"
            />
            <small
              *ngIf="confirmCtrl.touched && confirmPassword !== password"
              class="text-danger"
            >
              Les mots de passe ne correspondent pas.
            </small>
          </div>

          <button class="btn btn-primary mb-4" type="submit" [disabled]="passwordForm.invalid || confirmPassword !== password">
            Valider
          </button>
        </form>

        <!-- Messages -->
        <p class="text-success" *ngIf="message">{{ message }}</p>
        <p class="text-danger" *ngIf="error">{{ error }}</p>
      </div>
    </div>
  </div>
</div>

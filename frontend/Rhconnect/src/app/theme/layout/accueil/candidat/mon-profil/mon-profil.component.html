<div class="profil-container">
    <h2>Compléter votre inscription</h2>
    <form [formGroup]="profilForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <label>Nom</label>
        <input formControlName="nom" type="text"  />
      </div>
  
      <div class="form-row">
        <label>Prénom</label>
        <input formControlName="prenom" type="text"  />
      </div>
  
      <div class="form-row">
        <label>Date de naissance</label>
        <input formControlName="date_naissance" type="date" />
      </div>
      <div class="form-row">
      <label>Adresse</label>
      <input
        formControlName="adresse"
        type="text"
        placeholder="N° et rue, ville…"
      />
      <small class="err" *ngIf="
        profilForm.get('adresse')?.touched &&
        profilForm.get('adresse')?.errors
      ">
        Adresse trop courte ou invalide (au moins 5 caractères, lettres/chiffres autorisés).
      </small>
    </div>
      <div class="form-row">
      <label>Téléphone</label>
      <input
        formControlName="numero_tel"
        type="tel"
        inputmode="numeric"
        maxlength="8"
        placeholder="Ex: 20901234"
        (input)="keepDigitsOnly('numero_tel')"
      />
      <small class="err" *ngIf="
        profilForm.get('numero_tel')?.touched &&
        profilForm.get('numero_tel')?.hasError('tnPhone')
      ">
        Numéro invalide : 8 chiffres tunisiens. Préfixes mobiles : Ooredoo (20–29), Orange (50–59),
        TT (90–99). Fixe : 70–79.
      </small>
    </div>
      <div class="form-row">
        <label>Niveau d’étude</label>
        <select formControlName="niveau_etude">
          <option value="">-- Sélectionner --</option>
          <option value="Licence">Licence</option>
          <option value="Master">Master</option>
          <option value="Ingénierie">Ingénierie</option>
          <option value="Doctorat">Doctorat</option>
        </select>
      </div>
  
      
  
       <div class="actions">
    <button type="submit" class="save-btn">Enregistrer</button>
  </div>
    </form>
  </div>

<div class="container py-4">
  <h2 class="mb-4">
    <i class="bi bi-people-fill text-primary"></i>
    Liste des employés
  </h2>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let emp of employes">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h5 class="card-title mb-1">
            {{ emp.user.first_name }} {{ emp.user.last_name }}
          </h5>
          <p class="card-text text-muted mb-2">
            <i class="bi bi-briefcase-fill me-1 text-success"></i>
            {{ emp.poste_actuel }}
          </p>
          <p class="mb-0">
            <i class="bi bi-calendar-check-fill me-1 text-info"></i>
            Embauché le :
            <strong>{{ emp.date_embauche | date: 'longDate' }}</strong>
          </p>
        </div>
        <div class="card-footer bg-transparent border-0">
          <a class="btn btn-outline-primary btn-sm w-100"
             [routerLink]="['/admin/gestion-carriere/suivi', emp.id]">
            📊 Voir suivi de carrière
          </a>

          <button
            class="btn btn-outline-success btn-sm w-100 mt-2"
            (click)="ouvrirFormulaire(emp)"
            data-bs-toggle="modal"
            data-bs-target="#ajoutSuiviModal">
            ➕ Ajouter un suivi
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Modal d’ajout de suivi -->
  <div class="modal fade" id="ajoutSuiviModal" tabindex="-1" aria-labelledby="ajoutSuiviLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form (ngSubmit)="ajouterSuivi()" #formAjout="ngForm">
          <div class="modal-header">
            <h5 class="modal-title" id="ajoutSuiviLabel">
              Ajouter un suivi pour {{ selectedEmploye?.user.first_name }}
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>

          <div class="modal-body">
            <!-- Infos fixes -->
            <div class="mb-3">
              <label>Poste actuel :</label>
              <input type="text" class="form-control" [value]="selectedEmploye?.poste_actuel" readonly>
            </div>

            <div class="mb-3">
              <label>Département :</label>
              <input type="text" class="form-control" [value]="selectedEmploye?.departement" readonly>
            </div>

            <!-- Bouton pour afficher les champs de changement -->
            <button type="button" class="btn btn-sm btn-outline-primary mb-3" (click)="changerPosteVisible = true">
              ✏️ Changer le poste
            </button>

            <!-- Changement de poste -->
            <div *ngIf="changerPosteVisible">
              <div class="mb-3">
                <label>Ancien poste :</label>
                <input type="text" class="form-control" [(ngModel)]="suiviForm.ancien_poste" name="ancien_poste" readonly>
              </div>

              <div class="mb-3">
                <label>Nouveau poste :</label>
                <input type="text" class="form-control" [(ngModel)]="suiviForm.nouveau_poste" name="nouveau_poste" required>
              </div>

              <div class="mb-3">
                <label>Date de changement :</label>
                <input type="date" class="form-control" [(ngModel)]="suiviForm.date_changement" name="date_changement" required>
              </div>
            </div>

            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" [(ngModel)]="suiviForm.est_promotion" name="est_promotion">
              <label class="form-check-label">
                Est une promotion ?
              </label>
            </div>

            <div class="mb-3">
              <label>Commentaire :</label>
              <textarea class="form-control" [(ngModel)]="suiviForm.commentaire" name="commentaire"></textarea>
            </div>

            <!-- ✅ Objectifs (dynamiques) -->
            <div class="mb-3">
              <label class="form-label">Objectifs</label>
              <div class="vstack gap-2">
                <div class="input-group" *ngFor="let obj of suiviForm.objectifs; let i = index">
                  <input type="text" class="form-control" [(ngModel)]="suiviForm.objectifs[i]" name="objectif_{{i}}" placeholder="Ex: Obtenir certification X">
                  <button type="button" class="btn btn-outline-danger" (click)="removeObjectif(i)">Supprimer</button>
                </div>
                <button type="button" class="btn btn-outline-secondary btn-sm w-auto" (click)="addObjectif()">+ Ajouter un objectif</button>
              </div>
            </div>

            <!-- ✅ Notes (0..10) -->
            <div class="mb-2">
              <label class="form-label">Notes (0 à 10)</label>
              <div class="row g-2">
          <div class="col-md-4" *ngFor="let kv of (suiviForm.notes | keyvalue)">
  <label class="form-label">
    {{ NOTE_LABELS[$any(kv.key)] || kv.key }}
  </label>

  <input type="number" class="form-control" min="0" max="10" step="0.5"
         [ngModel]="getNoteValue($any(kv.key))"
         (ngModelChange)="setNoteValue($any(kv.key), $event)"
         name="note_{{$any(kv.key)}}">
</div>

              </div>
            </div>

         
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

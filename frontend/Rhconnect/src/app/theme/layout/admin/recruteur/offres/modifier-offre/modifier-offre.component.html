<app-card cardTitle="Modifier une offre" [options]="false" class="elevated-card">
 <form (ngSubmit)="onSubmit(offreForm)" #offreForm="ngForm" class="offer-form">
    <h5 class="form-title">Modifier une offre</h5>
    <hr />

    <div class="row gy-4">
      <!-- Colonne gauche -->
      <div class="col-md-6">
        <div class="form-group mb-4">
         <label for="titre">Titre</label>
          <input id="titre" name="titre" type="text" class="form-control modern-input"
                 [(ngModel)]="offre.titre" required [pattern]="titrePattern" #titre="ngModel"
                 [ngClass]="{'is-invalid': titre.invalid && (titre.dirty || titre.touched)}" />
          <div class="invalid-msg" *ngIf="titre.errors?.['required'] && (titre.dirty || titre.touched)">Requis.</div>
          <div class="invalid-msg" *ngIf="titre.errors?.['pattern'] && (titre.dirty || titre.touched)">Chiffres non autorisés.</div>
        </div>

        <div class="form-group mb-4">
           <label for="description">Description</label>
          <textarea id="description" name="description" rows="5" class="form-control modern-input"
                    [(ngModel)]="offre.description" required minlength="30" #desc="ngModel"
                    [ngClass]="{'is-invalid': desc.invalid && (desc.dirty || desc.touched)}"></textarea>
          <div class="invalid-msg" *ngIf="desc.errors?.['required'] && (desc.dirty || desc.touched)">Requis.</div>
          <div class="invalid-msg" *ngIf="desc.errors?.['minlength'] && (desc.dirty || desc.touched)">
            Au moins 30 caractères.
          </div>
        </div>

        <div class="form-group mb-4">
          <label for="type_poste">Type de poste</label>
          <select id="type_poste" name="type_poste" class="form-control modern-input"
                  [(ngModel)]="offre.type_poste" required #typep="ngModel"
                  [ngClass]="{'is-invalid': typep.invalid && (typep.dirty || typep.touched)}">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let t of TYPES_POSTE" [value]="t">{{ t }}</option>
          </select>
          <div class="invalid-msg" *ngIf="typep.invalid && (typep.dirty || typep.touched)">Requis.</div>
        </div>

        <div class="form-group mb-4">
           <label for="experience">Expérience</label>
          <select id="experience" name="experience" class="form-control modern-input"
                  [(ngModel)]="offre.experience" required #exp="ngModel"
                  [ngClass]="{'is-invalid': exp.invalid && (exp.dirty || exp.touched)}">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let e of EXPERIENCES" [value]="e.value">{{ e.label }}</option>
          </select>
          <div class="invalid-msg" *ngIf="exp.invalid && (exp.dirty || exp.touched)">Requis.</div>
        </div>
      </div>

      <!-- Colonne droite -->
      <div class="col-md-6">
        <div class="form-group mb-4">
           <label for="competences">Compétences</label>
  <input
    id="competences"
    name="competences"
    type="text"
    class="form-control modern-input"
    [(ngModel)]="offre.competences"
    required
    #comp="ngModel"
    [ngClass]="{ 'is-invalid': comp.invalid && (comp.dirty || comp.touched) }"
    placeholder="Ex : Python, Node.js, HTML5, C#, C++"
  />

  <div class="invalid-msg"
       *ngIf="comp?.errors?.['required'] && (comp.dirty || comp.touched)">
    Requis.
  </div>
</div>
        <div class="form-group mb-4">
          <label for="salaire">Salaire (TND)</label>
          <input id="salaire" name="salaire" type="number" class="form-control modern-input"
                 [(ngModel)]="offre.salaire" required [min]="SALAIRE_MIN" [max]="SALAIRE_MAX" step="1" #salaire="ngModel"
                 [ngClass]="{'is-invalid': salaire.invalid && (salaire.dirty || salaire.touched)}" />
          <div class="invalid-msg" *ngIf="salaire.errors?.['required'] && (salaire.dirty || salaire.touched)">Requis.</div>
          <div class="invalid-msg" *ngIf="salaire.errors?.['min'] && (salaire.dirty || salaire.touched)">
            Minimum {{SALAIRE_MIN}} TND.
          </div>
          <div class="invalid-msg" *ngIf="salaire.errors?.['max'] && (salaire.dirty || salaire.touched)">
            Maximum {{SALAIRE_MAX | number:'1.0-0'}} TND.
          </div>
        </div>

      <!-- Niveau d’étude (checkboxes) -->
<div class="form-group mb-4">
   <label class="d-block mb-2">Niveau d'étude</label>

          <!-- contrôle caché qui rend le groupe "required" -->
          <input type="hidden" name="niveau_required"
                 [ngModel]="niveauEtudeSel.length ? 'ok' : ''"
                 required #niv="ngModel">

          <div class="chk-group" [class.invalid]="niv.invalid && (niv.dirty || niv.touched)">
            <label class="chk-chip" *ngFor="let n of NIVEAUX_ETUDE">
              <input type="checkbox"
                     [checked]="niveauEtudeSel.includes(n.value)"
                     (change)="onToggleNiveau(n.value, $any($event.target).checked);
                               niv.control.markAsDirty(); niv.control.markAsTouched();" />
              <span class="chk-chip__label">{{ n.label }}</span>
            </label>
          </div>
          <div class="invalid-msg" *ngIf="niv.invalid && (niv.dirty || niv.touched)">
            Sélectionnez au moins un niveau d’étude.
          </div>
        </div>



        <div class="form-group mb-4">
          <label for="disponibilite">Disponibilité</label>
          <select id="disponibilite" name="disponibilite" class="form-control modern-input"
                  [(ngModel)]="offre.disponibilite" required #disp="ngModel"
                  [ngClass]="{'is-invalid': disp.invalid && (disp.dirty || disp.touched)}">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let d of DISPONIBILITES" [value]="d.value">{{ d.label }}</option>
          </select>
          <div class="invalid-msg" *ngIf="disp.invalid && (disp.dirty || disp.touched)">Requis.</div>
        </div>

        <div class="form-group mb-4">
          <label for="modalite">Modalité</label>
          <select id="modalite" name="modalite" class="form-control modern-input"
                  [(ngModel)]="offre.modalite" required #mod="ngModel"
                  [ngClass]="{'is-invalid': mod.invalid && (mod.dirty || mod.touched)}">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let m of MODALITES" [value]="m.value">{{ m.label }}</option>
          </select>
          <div class="invalid-msg" *ngIf="mod.invalid && (mod.dirty || mod.touched)">Requis.</div>
        </div>

        <div class="form-group mb-4">
           <label for="langues">Langues</label>
          <input id="langues" name="langues" type="text"
                 class="form-control modern-input"
                 [(ngModel)]="offre.langues"
                 required [pattern]="languesPattern" #langs="ngModel"
                 (input)="onLangChange($any($event.target).value)"
                 [ngClass]="{'is-invalid': (langs.invalid || !!languesError) && (langs.dirty || langs.touched)}"
                 placeholder="Ex : Français, Anglais, Arabe" />
          <div class="invalid-msg" *ngIf="langs.errors?.['required'] && (langs.dirty || langs.touched)">Requis.</div>
          <div class="invalid-msg" *ngIf="langs.errors?.['pattern'] && (langs.dirty || langs.touched)"></div>
          <div class="invalid-msg" *ngIf="!!languesError && (langs.dirty || langs.touched)">
            {{ languesError }}
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-2">
          <button type="button" class="btn btn-light soft-btn" (click)="annuler()">← Retour</button>
          <button type="submit" class="btn btn-primary pill-btn shadow-sm">Enregistrer</button>
        </div>
      </div>
    </div>
  </form>
</app-card>
